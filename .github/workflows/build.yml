name: Build EDITH APK

# Works in two layouts:
#  1) You uploaded the project files normally (settings.gradle.kts is in the repo root), or
#  2) You uploaded EDITH.zip as-is without extracting it: this workflow unzips it for you.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (unzip EDITH.zip if needed)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No project files and no .zip found in the repository root."; exit 1
            fi
            echo "Unpacking $ZIP"
            mkdir -p _unzipped
            unzip -q "$ZIP" -d _unzipped
            FOUND=$(find _unzipped -name settings.gradle.kts | head -n 1)
            if [ -z "$FOUND" ]; then echo "settings.gradle.kts not found inside $ZIP"; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EDITH-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

