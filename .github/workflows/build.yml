
name: Build EDITH APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract EDITH source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="EDITH-Upgrade-LocalWake-VAD-Screen.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Upload $ZIP_FILE to the repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/edith-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/edith-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/edith-source" \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in ZIP."
            find "$RUNNER_TEMP/edith-source" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "EDITH project found: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build EDITH debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug \
            --no-daemon --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/edith-build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build finished but no APK was found."
            exit 1
          fi

          echo "APK created: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload EDITH APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EDITH-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EDITH-build-error-log
          path: ${{ runner.temp }}/edith-build.log
          if-no-files-found: ignore
          retention-days: 7
