name: Build EDITH APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q EDITH.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        working-directory: EDITH
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || (grep -E "^e: " build.log | head -40; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: EDITH-apk
          path: EDITH/app/build/outputs/apk/debug/app-debug.apk
