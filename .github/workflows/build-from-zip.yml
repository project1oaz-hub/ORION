
name: Build ORION APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'ORION-v0.3-source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ORION source ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q ORION-v0.3-source.zip -d unpacked
          test -f unpacked/ORION-v0.2/settings.gradle.kts

      - name: Build debug APK
        working-directory: unpacked/ORION-v0.2
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-debug-APK
          path: unpacked/ORION-v0.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
