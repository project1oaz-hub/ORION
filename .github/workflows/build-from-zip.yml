
name: Build ORION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ORION source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'ORION*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Upload ORION source ZIP to repository root."
            exit 1
          fi

          mkdir source
          unzip -q "$ZIP_FILE" -d source

          # Locate the actual Android project directory.
          PROJECT_DIR=$(find source -name settings.gradle.kts \
            -o -name settings.gradle | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: ZIP must contain a complete Android Gradle project with gradlew."
            find source -maxdepth 3 -type f | head -n 80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


