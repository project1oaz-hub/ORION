name: Build EDITH APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q EDITH.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        working-directory: EDITH
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || (grep -E "^e: " build.log | head -40; exit 1)

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EDITH build ${{ github.run_number }}
          files: EDITH/app/build/outputs/apk/debug/app-debug.apk
